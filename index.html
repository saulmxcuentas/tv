<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            background: #0a0c10;
            overflow-x: hidden;
        }

        :root {
            --bg-page: #0a0c10;
            --card-bg: #14171c;
            --sidebar-bg: rgba(20, 23, 28, 0.96);
            --panel-bg: #1e2128;
            --text-primary: #f0f2f5;
            --text-secondary: #9ca3af;
            --border-light: #2d3139;
            --accent: #e63946;
            --accent-hover: #c1121f;
            --accent-soft: #2d1a1f;
            --video-placeholder: #1a1d24;
            --shadow-md: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
            --scrollbar-track: #1e2128;
            --scrollbar-thumb: #2d3139;
            --search-bg: #1a1d24;
            --option-bg: #1e2128;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .top-controls {
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 30;
            padding: 0.6rem 1rem 0 1rem;
        }
        
        .search-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--border-light);
        }
        
        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--search-bg);
            border: 1px solid var(--border-light);
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            width: min(280px, 70%);
            transition: all 0.2s;
        }
        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.85rem;
            color: var(--text-primary);
            width: 100%;
            font-family: inherit;
        }
        .search-box input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }
        .search-icon {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .clear-search {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            padding: 0 0.2rem;
            display: none;
        }
        .clear-search.visible {
            display: block;
        }
        .clear-search:hover {
            color: var(--accent);
        }
        
        .categories-tab-bar {
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            margin-top: 0.2rem;
            padding-bottom: 0.2rem;
        }
        .categories-tab-bar::-webkit-scrollbar {
            height: 3px;
        }
        .tabs-container {
            display: flex;
            gap: 0.2rem;
        }
        .category-tab {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            border-radius: 2rem 2rem 0 0;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            border-bottom: 2px solid transparent;
        }
        .category-tab:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }
        .category-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: var(--accent-soft);
        }
        .tab-icon {
            font-size: 1rem;
        }

        .channels-strip-container {
            background: var(--sidebar-bg);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-light);
            padding: 0.7rem 1rem;
            overflow-x: auto;
            scrollbar-width: thin;
            position: sticky;
            top: 72px;
            z-index: 20;
        }
        .channels-strip-container::-webkit-scrollbar {
            height: 4px;
        }
        .channels-strip {
            display: flex;
            gap: 0.7rem;
            flex-wrap: nowrap;
        }
        .channel-card-horizontal {
            background: var(--panel-bg);
            border-radius: 0.9rem;
            padding: 0.5rem 0.9rem;
            min-width: 130px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            border: 1px solid var(--border-light);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .channel-card-horizontal:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .channel-card-horizontal.active {
            border-left: 3px solid var(--accent);
            background: var(--accent-soft);
            border-color: var(--accent);
        }
        .ch-num-h {
            font-weight: 700;
            font-size: 0.75rem;
            background: var(--card-bg);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.7rem;
            color: var(--accent);
            font-family: monospace;
        }
        .ch-info-h {
            flex: 1;
            overflow: hidden;
        }
        .ch-name-h {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow-x: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }
        .ch-cat-h {
            font-size: 0.55rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .no-results {
            padding: 1rem;
            text-align: center;
            color: var(--text-secondary);
            width: 100%;
            font-size: 0.8rem;
        }

        .main-content {
            flex: 1;
            padding: 1rem 1.2rem 1.5rem 1.2rem;
        }
        
        .logo-compact {
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .logo-compact h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0f2f5 0%, #e63946 70%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0;
        }
        
        .logo-compact span {
            display: none;
        }

        .screen-wrapper {
            background: var(--card-bg);
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            margin-top: 0.8rem;
            width: 100%;
        }
        .video-frame {
            background: #000;
            aspect-ratio: 16 / 9;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-frame video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }
        
        video::-webkit-media-controls-fullscreen-button {
            display: block;
        }
        
        video:-webkit-full-page-media {
            max-height: 100%;
        }
        
        .welcome-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
            padding: 1rem;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--video-placeholder);
            z-index: 5;
        }
        .welcome-screen div:first-child { font-size: 2.5rem; }
        .welcome-screen div:nth-child(2) { font-size: 1rem; font-weight: 500; }
        .welcome-screen div:nth-child(3) { font-size: 0.7rem; }
        
        .video-frame.welcome-mode .welcome-screen { display: flex; }
        .video-frame.welcome-mode video { display: none; }
        .video-frame.video-mode .welcome-screen { display: none; }
        .video-frame.video-mode video { display: block; }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000dd;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            gap: 0.8rem;
            border-radius: 0;
        }
        .loading-dots {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            justify-content: center;
        }
        .loading-dots span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--accent);
            animation: bounce 1.4s infinite ease-in-out both;
            box-shadow: 0 0 6px rgba(230,57,70,0.6);
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        .loading-text {
            color: white;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px black;
        }
        .loading-sub {
            color: #ffccd0;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(0,0,0,0.4);
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        .source-selector {
            display: none;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
            margin-bottom: 0.3rem;
            flex-wrap: wrap;
        }
        .source-selector.visible {
            display: flex;
        }
        .source-btn {
            background: var(--option-bg);
            border: 1px solid var(--border-light);
            border-radius: 2rem;
            padding: 0.4rem 1.2rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-family: inherit;
        }
        .source-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        
        .footer-note {
            display: none;
        }

        @media (min-width: 768px) {
            .top-controls {

            }
            .search-box {

                padding: 0.5rem 1.2rem;
            }
            .category-tab {

            .channels-strip-container {

            .channel-card-horizontal {

            .ch-name-h {
                font-size: 0.85rem;
                max-width: 140px;
            }
            .ch-num-h {
                width: 38px;
                height: 38px;
                font-size: 0.85rem;
            }
            .main-content {
                padding: 1.5rem 2rem 1.5rem 2rem;
            }
            .logo-compact h1 {
                font-size: 2rem;
            }
            .source-btn {
                padding: 0.5rem 1.8rem;
                font-size: 0.8rem;
            }
            .loading-text {
                font-size: 1.1rem;
            }
            .loading-sub {
                font-size: 0.8rem;
            }
        }

        @media (min-width: 1024px) {
            .app-layout {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: flex-start;
                gap: 1rem;
                padding: 1rem 1.5rem;
            }
            .top-controls {
                position: sticky;
                top: 1rem;
                width: 320px;
                flex-shrink: 0;
                border-radius: 1.2rem;
                border: 1px solid var(--border-light);
                backdrop-filter: blur(16px);
                padding: 1rem;
                margin: 0;
                background: var(--sidebar-bg);
                order: 1;
                height: fit-content;
                max-height: 90vh;
                overflow-y: auto;
            }
            .search-row {
                justify-content: flex-start;
                border-bottom: none;
                margin-bottom: 0.8rem;
            }
            .search-box {
                width: 100%;
            }
            .categories-tab-bar {
                margin-bottom: 1rem;
                overflow-x: visible;
                white-space: normal;
            }
            .tabs-container {
                flex-wrap: wrap;
                gap: 0.4rem;
            }
            .category-tab {
                border-radius: 2rem;
                border-bottom: none;
                background: var(--panel-bg);
                padding: 0.5rem 1rem;
            }
            .category-tab.active {
                background: var(--accent);
                color: white;
                border-bottom: none;
            }
            .channels-strip-container {
                position: relative;
                top: 0;
                background: transparent;
                backdrop-filter: none;
                padding: 0;
                overflow-x: visible;
                margin-top: 1rem;
                border: none;
            }
            .channels-strip {
                flex-direction: column;
                flex-wrap: nowrap;
                gap: 0.6rem;
                max-height: 55vh;
                overflow-y: auto;
                padding-right: 0.5rem;
            }
            .channel-card-horizontal {
                min-width: auto;
                width: 100%;
            }
            .ch-name-h {
                max-width: 180px;
            }
            .main-content {
                flex: 1;
                order: 2;
                padding: 0;
                min-width: 0;
            }
            .video-frame {
                aspect-ratio: 16 / 9;
            }
            .source-selector {
                justify-content: flex-start;
            }
            .logo-compact {
                text-align: left;
                margin-bottom: 0.8rem;
            }
        }

        @media (min-width: 768px) and (max-width: 1023px) and (orientation: landscape) {
            .app-layout {
                display: block;
            }
            .top-controls {
                padding: 0.5rem 1rem 0 1rem;
            }
            .channels-strip-container {
                top: 62px;
            }
            .main-content {
                padding: 0.8rem 1rem 0.8rem 1rem;
            }
            .video-frame {
                aspect-ratio: 16 / 9;
                max-height: 70vh;
            }
            .channel-card-horizontal {
                min-width: 140px;
            }
        }

        @media (max-width: 480px) {
            .top-controls {
                padding: 0.4rem 0.8rem 0 0.8rem;
            }
            .channel-card-horizontal {
                min-width: 110px;
                padding: 0.4rem 0.7rem;
            }
            .ch-name-h {
                font-size: 0.7rem;
                max-width: 85px;
            }
            .ch-num-h {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
            .main-content {
                padding: 0.8rem;
            }
            .logo-compact h1 {
                font-size: 1.3rem;
            }
            .source-btn {
                padding: 0.3rem 1rem;
                font-size: 0.65rem;
            }
            .loading-text {
                font-size: 0.85rem;
            }
            .loading-sub {
                font-size: 0.6rem;
            }
        }
    </style>
</head>

<script>
    // Prevención de fullscreen automático
    let isFullscreenByUser = false;
    const playerVideo = document.getElementById('playerVideo');
    
    playerVideo.setAttribute('playsinline', 'true');
    playerVideo.setAttribute('webkit-playsinline', 'true');
    
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    
    function exitFullscreenIfNotUser() {
        if (!isFullscreenByUser) {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
    }
    
    document.addEventListener('fullscreenchange', function() {
        isFullscreenByUser = !!(document.fullscreenElement || document.webkitFullscreenElement);
    });
    document.addEventListener('webkitfullscreenchange', function() {
        isFullscreenByUser = !!(document.webkitFullscreenElement);
    });
    
    window.addEventListener('orientationchange', function() {
        setTimeout(exitFullscreenIfNotUser, 100);
    });
    
    let lastHeight = window.innerHeight;
    window.addEventListener('resize', function() {
        if (Math.abs(window.innerHeight - lastHeight) > 100) {
            setTimeout(exitFullscreenIfNotUser, 50);
        }
        lastHeight = window.innerHeight;
    });
    
    if (isIOS) {
        document.addEventListener('gesturestart', function(e) {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                e.preventDefault();
            }
        });
    }

        { name: "TUDN", group: "Deportes", url: "http://tecnotv.club/rm8h/phpcode/ssiptv.php?c=a05q&token=tecnotokenplustv230516F&f=.m3u8", emoji: "📡", num: 59 },
        { name: "TIGO GT", group: "Deportes", url: "http://tecnotv.club/rm8h/phpcode/ssiptv.php?c=a05t&token=tecnotokenplustv230516F&f=.m3u8", emoji: "🏆", num: 60 },
        { name: "STAR CHANNEL HD", group: "Series y Entretenimiento", url: "http://tecnotv.club/rm8h/phpcode/ssiptv.php?c=a0hn&token=tecnotokenplustv230516F&f=.m3u8", emoji: "⭐", num: 61 },
        { name: "STAR LIFE", group: "Series y Entretenimiento", url: "http://tecnotv.club/rm8h/phpcode/ssiptv.php?c=a0g4&token=tecnotokenplustv230516F&f=.m3u8", emoji: "✨", num: 62 },
        { name: "SONY HD", group: "Series y Entretenimiento", url: "http://tecnotv.club/rm8h/phpcode/ssiptv.php?c=a0hp&token=tecnotokenplustv230516F&f=.m3u8", emoji: "🎮", num: 63 }
    ];

    // Normalización y fusión
    function normalizeName(n) { return n.toLowerCase().replace(/[™®·]/g,'').replace(/\bhd\b|\bhdtv\b|\blatinoamerica\b|\bmx\b/gi,'').replace(/\s+/g,' ').trim().replace(/\b(\w+)\s+(\d+)\b/,'$1$2'); }
    const urlMap = new Map();
    rawChannelsTV05.forEach(ch => { let norm = normalizeName(ch.name); if(!urlMap.has(norm)) urlMap.set(norm, { url05: ch.url, url055: null, name05: ch.name, group05: ch.group }); else urlMap.get(norm).url05 = ch.url; });
    rawChannelsTV055.forEach(ch => { let norm = normalizeName(ch.name); if(!urlMap.has(norm)) urlMap.set(norm, { url05: null, url055: ch.url, name055: ch.name, group055: ch.group }); else { let e=urlMap.get(norm); e.url055=ch.url; e.name055=ch.name; e.group055=ch.group; } });
    
    const unifiedChannels = [];
    let idGen = 1;
    for (let [norm, data] of urlMap) {
        let group = data.group05 || data.group055 || "General";
        let displayName = data.name05 || data.name055 || norm;
        unifiedChannels.push({ id: idGen++, name: displayName, group, normName: norm, url05: data.url05, url055: data.url055, hasBoth: !!(data.url05 && data.url055) });
    }
    const groups = {};
    unifiedChannels.forEach(ch => { if(!groups[ch.group]) groups[ch.group] = []; groups[ch.group].push(ch); });
    const groupIcons = { "HBO":"🎬","Universal":"🌍","Series y Entretenimiento":"📺","Documentales":"🌿","Infantiles":"🧸","Películas":"🎥","General":"📡","Música":"🎵","Deportes":"⚽" };
    const CATEGORIES = Object.fromEntries(Object.entries(groups).map(([gName, chs]) => [gName, { icon: groupIcons[gName] || "📺", channels: chs }]));
    
    let currentCategory = Object.keys(CATEGORIES)[0];
    let currentChannel = unifiedChannels[0];
    let currentSource = currentChannel?.url05 ? "05" : "055";
    let searchQuery = "", isSearchMode = false, filteredCh = [];
    let currentHls = null, loadingTimeout = null, videoPlaying = false;
    
    const tabsC = document.getElementById('tabsContainer'), strip = document.getElementById('channelsStrip');
    const videoFrame = document.getElementById('videoFrame'), player = document.getElementById('playerVideo');
    const searchInp = document.getElementById('searchInput'), clearBtn = document.getElementById('clearSearchBtn');
    const selDiv = document.getElementById('sourceSelector'), src1 = document.getElementById('source1Btn'), src2 = document.getElementById('source2Btn');
    
    function loadingOverlay(chName) { 
        let d = document.createElement('div'); 
        d.className='loading-overlay'; 
        d.innerHTML=`<div class="loading-dots"><span></span><span></span><span></span></div><div class="loading-text">🔴 CARGANDO ${chName}</div><div class="loading-sub">Estableciendo conexión HD...</div>`; 
        return d; 
    }
    function removeLoad() { 
        if(window._curLoad && window._curLoad.parentElement) window._curLoad.remove(); 
        window._curLoad=null; 
        if(loadingTimeout) clearTimeout(loadingTimeout); 
        loadingTimeout=null; 
    }
    function showLoad(chName) { 
        videoPlaying=false; 
        removeLoad(); 
        let ov=loadingOverlay(chName); 
        videoFrame.style.position='relative'; 
        videoFrame.appendChild(ov); 
        window._curLoad=ov; 
        loadingTimeout=setTimeout(()=>{ 
            if(window._curLoad && !videoPlaying) removeLoad(); 
        }, 12000); 
    }
    function hideLoad() { removeLoad(); }
    function updateSourceVis() { if(currentChannel?.hasBoth) selDiv.classList.add('visible'); else selDiv.classList.remove('visible'); }
    function playChannel(ch, src) { 
        let url=src==="05"?ch.url05:ch.url055; 
        if(!url) return; 
        if(currentHls){ currentHls.destroy(); currentHls=null; } 
        videoFrame.classList.remove('welcome-mode'); 
        videoFrame.classList.add('video-mode'); 
        showLoad(ch.name); 
        player.pause(); 
        player.removeAttribute('src'); 
        player.load(); 
        let onPlay=()=>{ 
            videoPlaying=true; 
            hideLoad(); 
            player.removeEventListener('playing',onPlay); 
            player.removeEventListener('canplay',onPlay); 
        }; 
        player.addEventListener('playing',onPlay); 
        player.addEventListener('canplay',onPlay); 
        player.onerror=()=>{ hideLoad(); }; 
        if(url.includes('.m3u8') && Hls.isSupported()){ 
            currentHls=new Hls({debug:false, enableWorker:true}); 
            currentHls.loadSource(url); 
            currentHls.attachMedia(player); 
            currentHls.on(Hls.Events.MANIFEST_PARSED,()=>player.play().catch(e=>console.log)); 
            currentHls.on(Hls.Events.ERROR,(_,d)=> { 
                if(d.fatal && d.type===Hls.ErrorTypes.NETWORK_ERROR){ 
                    player.src=url; 
                    player.play().catch(e=>console.log); 
                } 
            }); 
        } else { 
            player.src=url; 
            player.play().catch(e=>console.log); 
        } 
    }
    function updateUI(){ playChannel(currentChannel, currentSource); document.querySelectorAll('.channel-card-horizontal').forEach(c=>c.classList.toggle('active',parseInt(c.dataset.id)===currentChannel.id)); updateSourceVis(); src1.classList.toggle('active',currentSource==="05"); src2.classList.toggle('active',currentSource==="055"); }
    function switchSource(newSrc){ if(currentSource===newSrc || !currentChannel?.hasBoth) return; currentSource=newSrc; updateUI(); }
    function renderChannels(){ let arr = (isSearchMode && searchQuery.trim()) ? filteredCh : (CATEGORIES[currentCategory]?.channels||[]); strip.innerHTML=''; if(arr.length===0){ strip.innerHTML='<div class="no-results">📺 Sin resultados</div>'; return; } arr.forEach(ch=>{ let card=document.createElement('div'); card.className='channel-card-horizontal'; if(ch.id===currentChannel?.id) card.classList.add('active'); card.dataset.id=ch.id; card.innerHTML=`<div class="ch-num-h">${ch.id}</div><div class="ch-info-h"><div class="ch-name-h">${ch.name}</div><div class="ch-cat-h">${ch.group}</div></div>`; card.addEventListener('click',()=>{ if(currentChannel?.id===ch.id) return; currentChannel=ch; currentSource = ch.url05?(ch.url055?"05":"05"):"055"; updateUI(); }); strip.appendChild(card); }); setTimeout(()=>{ let act=document.querySelector('.channel-card-horizontal.active'); if(act) act.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); },30); }
    function performSearch(q){ searchQuery=q.toLowerCase().trim(); if(!searchQuery){ isSearchMode=false; clearBtn.classList.remove('visible'); document.querySelectorAll('.category-tab').forEach(t=>t.classList.toggle('active',t.dataset.category===currentCategory)); } else { isSearchMode=true; clearBtn.classList.add('visible'); filteredCh=unifiedChannels.filter(c=>c.name.toLowerCase().includes(searchQuery)); if(filteredCh.length && (!currentChannel || !filteredCh.some(c=>c.id===currentChannel.id))){ currentChannel=filteredCh[0]; currentSource = currentChannel.url05?"05":"055"; updateUI(); } document.querySelectorAll('.category-tab').forEach(t=>t.classList.remove('active')); } renderChannels(); }
    function renderTabs(){ tabsC.innerHTML=''; for(let [cat,data] of Object.entries(CATEGORIES)){ let btn=document.createElement('button'); btn.className='category-tab'; if(cat===currentCategory && !isSearchMode) btn.classList.add('active'); btn.dataset.category=cat; btn.innerHTML=`<span class="tab-icon">${data.icon}</span><span>${cat}</span>`; btn.onclick=()=>{ if(isSearchMode){ searchInp.value=''; performSearch(''); } currentCategory=cat; document.querySelectorAll('.category-tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); let first=CATEGORIES[cat]?.channels[0]; if(first){ currentChannel=first; currentSource=first.url05?"05":"055"; updateUI(); } renderChannels(); }; tabsC.appendChild(btn); } }
    searchInp.addEventListener('input',e=>performSearch(e.target.value)); clearBtn.onclick=()=>{ searchInp.value=''; performSearch(''); }; src1.onclick=()=>switchSource("05"); src2.onclick=()=>switchSource("055");
    renderTabs(); renderChannels(); videoFrame.classList.add('welcome-mode'); if(unifiedChannels[0]) { currentChannel=unifiedChannels[0]; currentSource=currentChannel.url05?"05":"055"; updateUI(); }
    updateSourceVis();
    
    document.body.classList.remove('light');
</script>
